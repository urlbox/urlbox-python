[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "urlbox"
version = "1.0.7"
description = "Official Python client for the Urlbox API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Urlbox", email = "support@urlbox.com" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.33.0,<3", "validators>=0.18.2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/urlbox/urlbox-python"
"Bug Tracker" = "https://github.com/urlbox/urlbox-python/issues"

[tool.setuptools.packages.find]
include = ["urlbox*"]
